<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltagarprofil</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="step-info">
            <span id="stepText">Steg 1 av 5</span>
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="stepContent">

            <h2>Grunduppgifter</h2>

            <p>
                Här kommer vi senare lägga foto, namn,
                ålder och sysselsättning.
            </p>

        </div>

        <div class="buttons">

            <button
                id="backBtn"
                class="secondary"
                onclick="previousStep()"
                disabled>
                Tillbaka
            </button>

            <button
                id="nextBtn"
                onclick="nextStep()">
                Nästa
            </button>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
